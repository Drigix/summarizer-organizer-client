@switch (dateChangerType) {
  @case('month') {
    <p-toolbar>
      <p-button icon="pi pi-angle-left" (click)="onDateChange('previous')"></p-button>
      <div class="flex flex-column align-items-center">
        <span class="text-base">
        {{ date.getFullYear() }}
        </span>
        <span class="text-3xl font-bold">
        {{ getMonthName() }}
        </span>
      </div>
      <p-button icon="pi pi-angle-right" (click)="onDateChange('next')"></p-button>
    </p-toolbar>
  }
  @case('year') {
    <p-toolbar class="year-date-changer">
      <p-button icon="pi pi-angle-left" (click)="onDateChange('previous')"></p-button>
      <div class="flex flex-column align-items-center">
        <span class="text-base font-bold text-3xl">
        {{ date.getFullYear() }}
        </span>
      </div>
      <p-button icon="pi pi-angle-right" [disabled]="isNextChangeDisabled" (click)="onDateChange('next')"></p-button>
    </p-toolbar>
  }
}
