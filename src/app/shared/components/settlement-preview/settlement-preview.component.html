<div class="mt-2" [ngClass]="getComponentStyle('component-price-')">
  <p-fieldset [legend]="(getTitle() | currency:'PLN':'symbol-narrow': '2.0')!" [toggleable]="true">
    <div class="component-settlement-preview"
    [ngClass]="getComponentStyle('component-price-')">

    <div class="grid p-0">
      <div [ngClass]="{'col-8': priceType !== 'save', 'col-7': priceType === 'save'}">
        <p-iconField iconPosition="left">
          <p-inputIcon styleClass="pi pi-search" />
          <input class="w-93" type="text" pInputText placeholder="Search" [(ngModel)]="searchInput" (input)="onFilterChange($event)" />
        </p-iconField>
      </div>
      <div [ngClass]="{'col-4': priceType !== 'save', 'col-5': priceType === 'save'}" class="navbar flex justify-content-end">
        <div class="add-button mx-1">
          <p-button icon="pi pi-plus" (onClick)="onButtonClick('add')"></p-button>
        </div>
        <div class="edit-button mx-1">
          <p-button class="edit-button" icon="pi pi-pencil" [disabled]="!selectedSettlement" (onClick)="onButtonClick('edit')"></p-button>
        </div>
        <div class="delete-button mx-1">
          <p-button class="delete-button" icon="pi pi-trash" [disabled]="!selectedSettlement" (onClick)="onButtonClick('delete')"></p-button>
        </div>
        @if (priceType === 'save') {
          <div class="refresh-button mx-1">
            <p-button class="refresh-button" icon="pi pi-refresh" [disabled]="isRefreshDisabled()" (onClick)="onButtonClick('refresh')"></p-button>
          </div>
        }
        @if (priceType === 'save') {
          <div class="unrealized-profit-button mx-1">
            <p-button class="unrealized-profit-button" icon="pi pi-chart-line" (onClick)="onButtonClick('unrealized-profit')"></p-button>
          </div>
        }
      </div>
    </div>
    <p-divider type="solid" />

    <div class="middle">
      <div *ngFor="let settlement of settlements">
        <div class="list-item w-full flex align-items-center justify-content-between p-2"
          [ngClass]="settlement === selectedSettlement ? getComponentStyle('selected-settlement selected-price-') : ''"
          (click)="onSettlementSelected(settlement)"
          >
          <span class="grid align-items-center">
            <a *ngIf="settlement.linkUrl" class="col-2 settlement-link" (click)="goToLink(settlement.linkUrl)">
              <i class="pi pi-external-link text-base font-bold mr-2"></i>
            </a>
            <p class="flex justify-content-end white-space-nowrap overflow-hidden text-overflow-ellipsis" [ngClass]="settlement.linkUrl ? 'col-10' : 'col-12'">
              {{ settlement.description }}
            </p>
          </span>
          <span class="flex align-items-center text-2xl font-bold"
            [ngClass]="getComponentStyle('price-') ">
            <i class="mx-1 font-bold" [ngClass]="getPriceIcon()"></i>
            {{ settlement.price! * (settlement?.amount ?? 1) | currency:'PLN':'symbol-narrow': '2.0'}}
          </span>
        </div>
      </div>
    </div>

  </div>

  </p-fieldset>
</div>
